Here are the two distinct issues causing this behavior, followed by a direct fix.

### Why It's Happening
1. **Model Not Visible:** Google `<model-viewer>` expects your `.glb` file to sit in the same root folder as `index.html`. If the filename in your HTML code doesn't match the exact filename in your GitHub repository, the viewer stays blank.
2. **Button Hidden at the Bottom:** On mobile browsers (Safari/Chrome), `height: 100vh` includes the phone's address bar area. This pushes elements positioned at `bottom: 0` off the screen or under your phone's browser navigation bar. Using modern dynamic viewport units (`100dvh`) fixes this automatically.

---

### Step 1: Update Your `index.html` File

Replace all code in your `index.html` on GitHub with this updated version:

```html

    ar

    orientation="90deg 0deg 0deg"
    camera-controls 
    touch-action="pan-y">

    <div class="controls-container">
      
      <!-- Design Selection Buttons -->
      <div class="design-selector">
        <!-- Make sure the filename inside switchModel('...') matches your file on GitHub -->
        <button class="design-btn active" onclick="switchModel(this, 'your-file-name.glb')">Design 1</button>
      </div>

      <!-- AR Trigger Button -->
      <button slot="ar-button" class="ar-trigger-btn">
        View On Table
      </button>

    </div>

  </model-viewer>

  <script>
    const viewer = document.getElementById('ar-viewer');

    function switchModel(button, modelFilename) {
      viewer.src = modelFilename;
      document.querySelectorAll('.design-btn').forEach(btn => btn.classList.remove('active'));
      button.classList.add('active');
    }
