<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>HAUS STITCH — Virtual Table Try-On</title>
  
  <!-- Typography from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <!-- Google Model Viewer Web Component -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    :root {
      --hs-bg: #FAF8F5;
      --hs-dark: #1F2E23;
      --hs-accent: #8C907A;
      --hs-border: #E5E0D8;
      --hs-card-bg: #FFFFFF;
      --hs-shadow: rgba(31, 46, 35, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--hs-bg);
      font-family: 'Montserrat', sans-serif;
      color: var(--hs-dark);
    }

    /* Main Container with Flex Layout */
    .app-viewport {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      width: 100vw;
      position: relative;
    }

    /* Brand Header Header Overlay */
    header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: max(16px, env(safe-area-inset-top)) 16px 12px;
      text-align: center;
      z-index: 20;
      background: linear-gradient(180deg, rgba(250, 248, 245, 0.95) 0%, rgba(250, 248, 245, 0.8) 70%, rgba(250, 248, 245, 0) 100%);
      pointer-events: none;
    }

    header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--hs-dark);
      line-height: 1.1;
    }

    header p {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--hs-accent);
      margin-top: 4px;
    }

    /* 3D Canvas Area */
    .viewer-section {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      background: radial-gradient(circle at center, #FFFFFF 0%, var(--hs-bg) 80%);
    }

    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
    }

    /* Interactive Instruction Badge */
    .hint-badge {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid var(--hs-border);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      color: var(--hs-dark);
      letter-spacing: 0.5px;
      pointer-events: none;
      z-index: 15;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 8px var(--hs-shadow);
    }

    /* Controls & Navigation Panel */
    .bottom-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 16px max(24px, env(safe-area-inset-bottom));
      background: linear-gradient(0deg, rgba(250, 248, 245, 0.98) 0%, rgba(250, 248, 245, 0.85) 75%, rgba(250, 248, 245, 0) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      z-index: 20;
    }

    /* Thumbnails Horizontal Scroll */
    .design-selector {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      max-width: 100%;
      padding: 4px 8px;
      scrollbar-width: none;
    }
    .design-selector::-webkit-scrollbar {
      display: none;
    }

    /* Design Thumbnail Card */
    .design-card {
      background: var(--hs-card-bg);
      border: 1.5px solid var(--hs-border);
      padding: 6px 12px 6px 8px;
      border-radius: 28px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 2px 8px var(--hs-shadow);
      white-space: nowrap;
    }

    .design-card.active {
      background: var(--hs-dark);
      border-color: var(--hs-dark);
      color: #FFFFFF;
    }

    .design-card .icon-box {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--hs-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--hs-border);
      overflow: hidden;
    }

    .design-card.active .icon-box {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .design-card .icon-box svg {
      width: 18px;
      height: 18px;
      stroke: var(--hs-dark);
    }

    .design-card.active .icon-box svg {
      stroke: #FFFFFF;
    }

    .design-card span {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    /* Main AR Trigger Button */
    .ar-button {
      background-color: var(--hs-dark);
      color: #FFFFFF;
      border: none;
      padding: 16px 36px;
      border-radius: 35px;
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(31, 46, 35, 0.3);
      display: flex;
      align-items: center;
      gap: 10px;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .ar-button:active {
      transform: scale(0.96);
    }

    .ar-button svg {
      width: 18px;
      height: 18px;
    }
  </style>
</head>
<body>

  <div class="app-viewport">
    
    <!-- Haus Stitch Branding -->
    <header>
      <h1>HAUS STITCH</h1>
      <p>Virtual Placemat Try-On</p>
    </header>

    <!-- Visual Hint -->
    <div class="hint-badge">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"></path>
        <path d="M12 8v4l3 3"></path>
      </svg>
      Drag to rotate 3D preview
    </div>

    <!-- 3D Model & AR Canvas -->
    <div class="viewer-section">
      <model-viewer 
        id="ar-viewer"
        src="placemat.glb" 
        alt="Haus Stitch Placemat Design" 
        ar 
        ar-modes="webxr scene-viewer quick-look" 
        ar-placement="floor"
        orientation="90deg 0deg 0deg"
        camera-controls 
        touch-action="pan-y"
        shadow-intensity="1.2"
        shadow-softness="0.8"
        exposure="1"
        bounds="tight"
        auto-rotate
        auto-rotate-delay="3000">

        <!-- Bottom UI Overlaid Inside Model Viewer -->
        <div class="bottom-panel" slot="interaction-prompt"></div>
        <div class="bottom-panel">
          
          <!-- Thumbnail Selector (Defaults to placemat.glb) -->
          <div class="design-selector">
            <div class="design-card active" onclick="selectDesign(this, 'placemat.glb', 'Classic Placemat')">
              <div class="icon-box">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="5" width="18" height="14" rx="2"></rect>
                  <line x1="7" y1="9" x2="17" y2="9"></line>
                  <line x1="7" y1="13" x2="17" y2="13"></line>
                  <line x1="7" y1="17" x2="12" y2="17"></line>
                </svg>
              </div>
              <span>Classic Placemat</span>
            </div>
          </div>

          <!-- AR Camera Trigger Button -->
          <button slot="ar-button" class="ar-button" id="ar-trigger">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
              <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
              <line x1="12" y1="22.08" x2="12" y2="12"></line>
            </svg>
            View On Table
          </button>

        </div>

      </model-viewer>
    </div>

  </div>

  <script>
    const viewer = document.getElementById('ar-viewer');

    function selectDesign(cardElement, modelFile, designTitle) {
      // Update model viewer src
      viewer.src = modelFile;

      // Toggle UI active states
      document.querySelectorAll('.design-card').forEach(card => card.classList.remove('active'));
      cardElement.classList.add('active');
    }
  </script>
</body>
</html>
