<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtual Placemat Try-On</title>
  <!-- Load Model Viewer script -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; padding: 0; font-family: sans-serif; }
    model-viewer { width: 100vw; height: 100vh; }
  </style>
</head>
<body>

  <model-viewer 
    src="placemat.glb" 
    ios-src="placemat.usdz" 
    alt="Table Placemat Design" 
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    touch-action="pan-y">
    <button slot="ar-button" style="background: #000; color: #fff; padding: 12px 24px; border: none; border-radius: 20px; position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); font-size: 16px;">
      View on your table (AR)
    </button>
  </model-viewer>

</body>
</html>
