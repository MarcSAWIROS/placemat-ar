<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haus Stitch — Virtual Table Try-On</title>
  <!-- Google Fonts: Cormorant Garamond & Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  
  <!-- Load Google Model Viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    :root {
      --hs-bg: #FAF8F5;
      --hs-dark: #1F2E23;
      --hs-accent: #8C907A;
      --hs-light-border: #E5E0D8;
      --hs-card-bg: #FFFFFF;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Montserrat', sans-serif;
      background-color: var(--hs-bg);
      color: var(--hs-dark);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* Top Brand Header */
    header {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 20px 16px 12px;
      text-align: center;
      z-index: 10;
      background: linear-gradient(180deg, rgba(250,248,245,0.95) 0%, rgba(250,248,245,0) 100%);
      pointer-events: none;
    }

    header h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--hs-dark);
    }

    header p {
      font-size: 11px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--hs-accent);
      margin-top: 4px;
    }

    /* AR Viewport */
    model-viewer {
      width: 100vw;
      height: 100vh;
      --poster-color: transparent;
    }

    /* Bottom Design Selector Container */
    .controls-container {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 16px 12px 28px;
      background: linear-gradient(0deg, rgba(250,248,245,0.98) 0%, rgba(250,248,245,0.85) 75%, rgba(250,248,245,0) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      z-index: 10;
    }

    /* Horizontal Design Scroll Bar */
    .design-selector {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      max-width: 100%;
      padding: 4px 8px;
      scrollbar-width: none;
    }
    .design-selector::-webkit-scrollbar { display: none; }

    /* Design Button Cards */
    .design-btn {
      background: var(--hs-card-bg);
      border: 1px solid var(--hs-light-border);
      padding: 10px 16px;
      border-radius: 20px;
      font-family: 'Montserrat', sans-serif;
      font-size: 12px;
      font-weight: 500;
      color: var(--hs-dark);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.25s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }

    .design-btn.active {
      background: var(--hs-dark);
      color: #FFFFFF;
      border-color: var(--hs-dark);
      box-shadow: 0 4px 10px rgba(31,46,35,0.2);
    }

    /* Main AR Trigger Button */
    .ar-trigger-btn {
      background-color: var(--hs-dark);
      color: #FFFFFF;
      border: none;
      padding: 16px 36px;
      border-radius: 30px;
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(31, 46, 35, 0.25);
      transition: transform 0.2s ease, background 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ar-trigger-btn:active {
      transform: scale(0.97);
    }
  </style>
</head>
<body>

  <!-- Brand Header -->
  <header>
    <h1>HAUS STITCH</h1>
    <p>Virtual Table Try-On</p>
  </header>

  <!-- 3D & AR Viewer Component -->
  <model-viewer 
    id="ar-viewer"
    src="placemat1.glb" 
    alt="Haus Stitch Table Design" 
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    ar-placement="floor"
    orientation="90deg 0deg 0deg"
    camera-controls 
    touch-action="pan-y">

    <div class="controls-container" slot="interaction-prompt"></div>

    <!-- AR Launch Controls Overlay -->
    <div class="controls-container">
      
      <!-- Design Selection Buttons -->
      <div class="design-selector" id="designList">
        
        <!-- EDIT/ADD YOUR MODELS HERE -->
        <button class="design-btn active" onclick="switchModel(this, 'placemat1.glb')">Ziggy Eggshell</button>
        <button class="design-btn" onclick="switchModel(this, 'placemat2.glb')">Ziggy Green</button>
        <button class="design-btn" onclick="switchModel(this, 'placemat3.glb')">Ziggy Mocha</button>
        <!-- TO ADD MORE: Simply copy a line above and replace the filename! -->

      </div>

      <!-- AR Trigger Button -->
      <button slot="ar-button" class="ar-trigger-btn" id="arButton">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
          <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
          <line x1="12" y1="22.08" x2="12" y2="12"></line>
        </svg>
        View On Table
      </button>

    </div>
  </model-viewer>

  <script>
    const viewer = document.getElementById('ar-viewer');

    function switchModel(button, modelFilename) {
      // Update model source
      viewer.src = modelFilename;

      // Update active button styling
      document.querySelectorAll('.design-btn').forEach(btn => btn.classList.remove('active'));
      button.classList.add('active');
    }
  </script>

</body>
</html>
